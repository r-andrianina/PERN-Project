services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: specimenmanager_db
    restart: always
    environment:
      POSTGRES_DB: specimenmanager
      POSTGRES_USER: postgres
      # Mot de passe hors du fichier committé : défini dans .env (voir .env.example).
      # Doit correspondre au volume pgdata existant et au DATABASE_URL de backend/.env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD dans .env (voir .env.example)}
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  pgdata: