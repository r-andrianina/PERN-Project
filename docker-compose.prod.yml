# docker-compose.prod.yml
# Déploiement production — Synology NAS (x86_64)
# Usage : docker compose -f docker-compose.prod.yml up -d --build

# Nom de projet explicite : évite la collision avec l'ancien projet
# "specimenmanager" (PHP) dans Container Manager — Compose normalise les
# noms de dossier en minuscules, donc /volume1/docker/SpecimenManager et
# /volume1/docker/specimenmanager finissent tous deux sur "specimenmanager".
name: sm_pern

services:

  # ── Base de données PostgreSQL 16 + PostGIS 3.4 ───────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       specimenmanager
      POSTGRES_USER:     smuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata16:/var/lib/postgresql/data
      # Active PostGIS au premier démarrage (base vide uniquement)
      - ./db/init-postgis.sh:/docker-entrypoint-initdb.d/01-postgis.sh
    networks:
      - sm_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smuser -d specimenmanager"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Backend Node.js 20 ────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sm_backend
    restart: unless-stopped
    env_file: ./backend/.env.production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sm_network
    volumes:
      # Fichiers uploadés (Excel imports) persistés sur le NAS
      - uploads:/app/uploads
      # Shapefile Fokontany pour l'import géo (lecture seule)
      - ./fokontany:/app/fokontany:ro

  # ── Nginx : sert React + reverse proxy vers backend ───────────
  # Le frontend est pré-compilé localement (npm run build) puis transféré
  # sur le NAS. Dockerfile.dist copie simplement le dist/ dans nginx.
  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dist
    container_name: sm_nginx
    restart: unless-stopped
    ports:
      # Port 8080 exposé → Proxy Inversé DSM fait le HTTPS
      - "8080:80"
    depends_on:
      - backend
    networks:
      - sm_network

networks:
  sm_network:
    driver: bridge

volumes:
  # External : référencent les volumes existants du déploiement initial
  # (créés sous l'ancien nom de projet "specimenmanager") pour ne pas
  # perdre la base de données / les fichiers uploadés au changement de nom.
  pgdata16:
    external: true
    name: specimenmanager_pgdata16
  uploads:
    external: true
    name: specimenmanager_uploads
