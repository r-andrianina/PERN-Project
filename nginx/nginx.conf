# nginx/nginx.conf
# Sert le frontend React (SPA) et proxie /api/* vers le backend Node.js

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── React SPA ─────────────────────────────────────────────────
    # Toutes les routes React → index.html (React Router gère le routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy API → backend ───────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
        # Taille max upload fichiers Excel IPM
        client_max_body_size  20M;
    }

    # ── Cache assets compilés (nom avec hash Vite) ────────────────
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── index.html sans cache (détecte les nouvelles versions) ────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
